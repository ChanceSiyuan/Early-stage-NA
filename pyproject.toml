[project]
name = "early-stage-na"
version = "0.1.0"
description = "M=2 Virtual Distillation / Error Suppression by Derangement simulation"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.0,<3.0",
    "qiskit-aer>=0.15",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
